[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "darksouls-gitpush"
version = "1.0.0"
description = "Dark Souls style CODE PUSHED / YOU DIED banner for your terminal"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["Pillow"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.scripts]
code-pushed = "darksouls_gitpush.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
darksouls_gitpush = ["assets/*.ttf"]
