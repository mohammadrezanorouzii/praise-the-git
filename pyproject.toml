[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "praise-the-git"
version = "1.1.0"
description = "Praise the Git \\[T]/ — Dark Souls style banners for git: CODE PUSHED, YOU DIED, VICTORY ACHIEVED"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["Pillow"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.scripts]
praise = "praise_the_git.cli:main"

[tool.setuptools]
packages = ["praise_the_git", "praise_the_git.assets"]
package-dir = { praise_the_git = "src" }

[tool.setuptools.package-data]
praise_the_git = ["assets/*.ttf"]
